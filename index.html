<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Madame Destiny Megaways - Pragmatic Play Demo</title>
    <link rel="icon" href="https://www.pragmaticplay.com/wp-content/uploads/2019/03/cropped-222-32x32.png" sizes="32x32">
    <link rel="stylesheet" id="clean-css" href="https://www.pragmaticplay.com/wp-content/themes/gp-theme-basic/libs/dist/css/main.min.css?ver=v1.3.180" media="all">
    <style id="mobile-fullscreen-css">
        body {
            background-color: #121212;
            color: #fff;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* Container responsiveness & edge-to-edge on mobile */
        @media (max-width: 768px) {
            body {
                padding: 0 !important;
                margin: 0 !important;
            }
            .container {
                width: 100% !important;
                max-width: 100% !important;
                padding-left: 0 !important;
                padding-right: 0 !important;
                margin: 0 !important;
            }
            .row {
                margin-left: 0 !important;
                margin-right: 0 !important;
            }
            .game-fullscreen {
                padding-left: 0 !important;
                padding-right: 0 !important;
            }
        }

        /* --- Normal (Non-fullscreen) Mode Container --- */
        .game-details__iframe-container {
            position: relative !important;
            width: 100% !important;
            overflow: hidden !important;
            background-color: #000 !important;
        }

        /* Desktop: Standard 16/9 ratio with minimum comfortable height */
        @media (min-width: 769px) {
            .game-details__iframe-container.html5-ratio {
                height: auto !important;
                aspect-ratio: 16 / 9 !important;
                min-height: 520px !important;
                padding-bottom: 0 !important;
                border-radius: 8px 8px 0 0 !important;
            }
        }

        /* Mobile Portrait (iPhone & Android): Sized to give Pragmatic Play reels adequate vertical room */
        @media (max-width: 768px) and (orientation: portrait) {
            .game-details__iframe-container.html5-ratio {
                height: 75vh !important;
                height: 75dvh !important;
                min-height: 500px !important;
                max-height: 84vh !important;
                padding-bottom: 0 !important;
                border-radius: 0 !important;
            }
        }

        /* Mobile Landscape (iPhone & Android): Full viewport height minus bottom bar */
        @media (max-width: 768px) and (orientation: landscape) {
            .game-details__iframe-container.html5-ratio {
                height: calc(100vh - 46px) !important;
                height: calc(100dvh - 46px) !important;
                min-height: 320px !important;
                padding-bottom: 0 !important;
                border-radius: 0 !important;
            }
        }

        /* CRITICAL FOR WEBKIT (iOS SAFARI) & ANDROID CHROME:
           Fix WebKit 0px height collapse inside padding/aspect containers.
           Pin wrapper and game divs directly to container bounds. */
        .game-details__iframe-container .game_wrapper,
        .game-details__iframe-container .game {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
            width: 100% !important;
            height: 100% !important;
            min-height: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
            display: block !important;
            overflow: hidden !important;
        }

        .game-details__iframe-container iframe,
        #iframe {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
            width: 100% !important;
            height: 100% !important;
            min-width: 100% !important;
            min-height: 100% !important;
            border: 0 !important;
            margin: 0 !important;
            padding: 0 !important;
            display: block !important;
            -webkit-overflow-scrolling: touch !important;
        }

        /* --- Fullscreen Mode (Native & Simulated for iOS) --- */
        .game-fullscreen:fullscreen,
        .game-fullscreen:-webkit-full-screen,
        .game-fullscreen:-moz-full-screen,
        .game-fullscreen:-ms-fullscreen,
        .game-fullscreen.is-fullscreen,
        .game-fullscreen.fullscreen {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
            width: 100vw !important;
            width: 100% !important;
            height: 100vh !important;
            height: 100dvh !important;
            max-width: none !important;
            max-height: none !important;
            margin: 0 !important;
            padding: 0 !important;
            z-index: 2147483647 !important;
            background-color: #000 !important;
            display: flex !important;
            flex-direction: column !important;
            overflow: hidden !important;
            box-sizing: border-box !important;
        }

        .game-fullscreen:fullscreen .game-details__iframe-container,
        .game-fullscreen:-webkit-full-screen .game-details__iframe-container,
        .game-fullscreen:-moz-full-screen .game-details__iframe-container,
        .game-fullscreen:-ms-fullscreen .game-details__iframe-container,
        .game-fullscreen.is-fullscreen .game-details__iframe-container,
        .game-fullscreen.fullscreen .game-details__iframe-container {
            position: relative !important;
            flex: 1 1 auto !important;
            width: 100% !important;
            height: calc(100% - 46px) !important;
            height: calc(100dvh - 46px) !important;
            min-height: 0 !important;
            max-height: none !important;
            padding-bottom: 0 !important;
            margin: 0 !important;
            overflow: hidden !important;
            display: block !important;
            border-radius: 0 !important;
        }

        .game-fullscreen:fullscreen .game-details__iframe-nav,
        .game-fullscreen:-webkit-full-screen .game-details__iframe-nav,
        .game-fullscreen:-moz-full-screen .game-details__iframe-nav,
        .game-fullscreen:-ms-fullscreen .game-details__iframe-nav,
        .game-fullscreen.is-fullscreen .game-details__iframe-nav,
        .game-fullscreen.fullscreen .game-details__iframe-nav {
            flex: 0 0 auto !important;
            position: relative !important;
            bottom: auto !important;
            left: auto !important;
            right: auto !important;
            width: 100% !important;
            height: 46px !important;
            min-height: 46px !important;
            background: #111 !important;
            background: rgba(18, 18, 18, 0.95) !important;
            backdrop-filter: blur(8px) !important;
            -webkit-backdrop-filter: blur(8px) !important;
            padding: 8px 16px !important;
            padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)) !important;
            padding-left: calc(16px + env(safe-area-inset-left, 0px)) !important;
            padding-right: calc(16px + env(safe-area-inset-right, 0px)) !important;
            z-index: 1000 !important;
            display: flex !important;
            justify-content: space-between !important;
            align-items: center !important;
            box-sizing: border-box !important;
            border-top: 1px solid rgba(255, 255, 255, 0.15) !important;
            border-radius: 0 !important;
        }

        @media (max-height: 500px) and (orientation: landscape) {
            .game-fullscreen:fullscreen .game-details__iframe-nav,
            .game-fullscreen:-webkit-full-screen .game-details__iframe-nav,
            .game-fullscreen.is-fullscreen .game-details__iframe-nav,
            .game-fullscreen.fullscreen .game-details__iframe-nav {
                height: 38px !important;
                min-height: 38px !important;
                padding: 4px 12px !important;
            }
            .game-fullscreen:fullscreen .game-details__iframe-container,
            .game-fullscreen:-webkit-full-screen .game-details__iframe-container,
            .game-fullscreen.is-fullscreen .game-details__iframe-container,
            .game-fullscreen.fullscreen .game-details__iframe-container {
                height: calc(100% - 38px) !important;
                height: calc(100dvh - 38px) !important;
            }
        }

        html.game-is-fullscreen,
        body.game-is-fullscreen {
            overflow: hidden !important;
            touch-action: none !important;
        }

        .game-details__iframe-btn {
            cursor: pointer !important;
            user-select: none !important;
            -webkit-user-select: none !important;
            touch-action: manipulation !important;
        }

        /* Navigation bar layout in normal mode */
        .game-details__iframe-nav {
            display: flex !important;
            justify-content: space-between !important;
            align-items: center !important;
            gap: 10px !important;
            background: #111 !important;
            padding: 8px 14px !important;
            border-radius: 0 0 8px 8px !important;
            box-sizing: border-box !important;
        }

        @media (max-width: 768px) {
            .game-details__iframe-nav {
                border-radius: 0 !important;
            }
        }

        /* Currency Toggle Switcher (USD <-> IDR) */
        .currency-toggle-group {
            display: inline-flex !important;
            align-items: center !important;
            background: rgba(255, 255, 255, 0.08) !important;
            border: 1px solid rgba(255, 255, 255, 0.16) !important;
            border-radius: 20px !important;
            padding: 2px !important;
            gap: 2px !important;
            flex-shrink: 0 !important;
        }

        .currency-btn {
            background: transparent !important;
            border: none !important;
            color: #bbb !important;
            font-size: 12px !important;
            font-weight: 600 !important;
            padding: 4px 11px !important;
            border-radius: 16px !important;
            cursor: pointer !important;
            transition: all 0.2s ease !important;
            outline: none !important;
            user-select: none !important;
            -webkit-user-select: none !important;
            touch-action: manipulation !important;
            line-height: 1.2 !important;
        }

        .currency-btn:hover {
            color: #fff !important;
            background: rgba(255, 255, 255, 0.08) !important;
        }

        .currency-btn.active {
            background: #ff800e !important;
            color: #fff !important;
            box-shadow: 0 2px 8px rgba(255, 128, 14, 0.45) !important;
        }

        @media (max-width: 480px) {
            .game-details__iframe-nav {
                padding: 6px 10px !important;
                gap: 6px !important;
            }
            .currency-btn {
                font-size: 11px !important;
                padding: 3px 8px !important;
            }
        }
    </style>
</head>

<body class="games-template-default single single-games">
    <div class="container">
        <div class="row">
            <div class="game-fullscreen col-lg-12 col-md-12 col-sm-12 col-xs-12" data-fullscreen="">
                <div class="game-details__iframe-container html5-ratio">
                    <div class="game_wrapper">
                        <div class="game">
                            <iframe id="iframe"
                                    tabindex="0"
                                    frameborder="0"
                                    scrolling="no"
                                    playsinline="true"
                                    webkit-playsinline="true"
                                    allowfullscreen="true"
                                    webkitallowfullscreen="true"
                                    mozallowfullscreen="true"
                                    allow="fullscreen; autoplay; screen-wake-lock; encrypted-media; gyroscope; accelerometer"
                                    data-game-src="https://demogamesfree.pragmaticplay.net/gs2c/openGame.do?gameSymbol=vswaysmwss&amp;websiteUrl=https%3A%2F%2Fdemogamesfree.pragmaticplay.net&amp;jurisdiction=99&amp;lobby_url=https%3A%2F%2Fwww.pragmaticplay.com%2Fen%2F&amp;lang=en&amp;cur=USD"
                                    style="border:none;"
                                    src="https://demogamesfree.pragmaticplay.net/gs2c/openGame.do?gameSymbol=vswaysmwss&amp;websiteUrl=https%3A%2F%2Fdemogamesfree.pragmaticplay.net&amp;jurisdiction=99&amp;lobby_url=https%3A%2F%2Fwww.pragmaticplay.com%2Fen%2F&amp;lang=en&amp;cur=USD">
                            </iframe>
                        </div>
                    </div>
                </div>
                <div class="game-details__iframe-nav">
                    <div class="currency-toggle-group">
                        <button type="button" class="currency-btn active" data-currency="USD" title="Ganti ke Saldo USD">$ USD</button>
                        <button type="button" class="currency-btn" data-currency="IDR" title="Ganti ke Saldo IDR">Rp IDR</button>
                    </div>
                    <div data-buttons="" class="pull-right">
                        <div data-open="">
                            <a class="game-details__iframe-btn pull-right">
                                <i class="fa fa-expand"></i><span>Layar penuh</span>
                            </a>
                        </div>
                        <div data-close="" style="display:none">
                            <a class="game-details__iframe-btn pull-right">
                                <i class="fa fa-compress"></i><span>Keluar layar penuh</span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script id="mobile-fullscreen-fix">
        (function () {
            // Safe localStorage helper (protects against iOS Safari Private Browsing quota/security exceptions)
            var safeStorage = {
                get: function (key) {
                    try {
                        return window.localStorage ? window.localStorage.getItem(key) : null;
                    } catch (e) {
                        return null;
                    }
                },
                set: function (key, val) {
                    try {
                        if (window.localStorage) {
                            window.localStorage.setItem(key, val);
                        }
                    } catch (e) {}
                }
            };

            function setupGame() {
                var container = document.querySelector('[data-fullscreen]');
                if (!container) return;

                var iframe = container.querySelector('#iframe') || container.querySelector('iframe');
                var buttons = container.querySelector('[data-buttons]');
                var openWrapper = container.querySelector('[data-open]');
                var closeWrapper = container.querySelector('[data-close]');
                var isFullscreenState = false;

                if (iframe) {
                    iframe.setAttribute('allowfullscreen', 'true');
                    iframe.setAttribute('webkitallowfullscreen', 'true');
                    iframe.setAttribute('mozallowfullscreen', 'true');
                    iframe.setAttribute('playsinline', 'true');
                    iframe.setAttribute('webkit-playsinline', 'true');
                    iframe.setAttribute('allow', 'fullscreen; autoplay; screen-wake-lock; encrypted-media; gyroscope; accelerometer');
                }

                // --- Currency Switcher (USD <-> IDR) ---
                var currencyBtns = container.querySelectorAll('.currency-btn');
                function setCurrency(cur, force) {
                    var currentSaved = safeStorage.get('game_currency') || 'USD';
                    if (!force && currentSaved === cur) return;

                    safeStorage.set('game_currency', cur);

                    currencyBtns.forEach(function (btn) {
                        if (btn.getAttribute('data-currency') === cur) {
                            btn.classList.add('active');
                        } else {
                            btn.classList.remove('active');
                        }
                    });

                    if (!iframe) return;

                    var currentSrc = iframe.getAttribute('data-game-src') || iframe.src || '';

                    // Avoid restarting iframe if it already loaded requested currency
                    if (force && currentSrc.indexOf('cur=' + cur) !== -1) {
                        return;
                    }

                    var lang = (cur === 'IDR') ? 'id' : 'en';
                    var lobby = (cur === 'IDR') ?
                        'https%3A%2F%2Fwww.pragmaticplay.com%2Fid%2F' :
                        'https%3A%2F%2Fwww.pragmaticplay.com%2Fen%2F';

                    var symbolMatch = currentSrc.match(/gameSymbol=([a-zA-Z0-9_]+)/);
                    var symbol = (symbolMatch && symbolMatch[1]) ? symbolMatch[1] : 'vswaysmwss';

                    var newSrc = 'https://demogamesfree.pragmaticplay.net/gs2c/openGame.do?gameSymbol=' + symbol +
                                 '&websiteUrl=https%3A%2F%2Fdemogamesfree.pragmaticplay.net&jurisdiction=99&lobby_url=' + lobby +
                                 '&lang=' + lang + '&cur=' + cur;

                    iframe.setAttribute('data-game-src', newSrc);
                    iframe.src = newSrc;
                }

                currencyBtns.forEach(function (btn) {
                    btn.addEventListener('click', function (e) {
                        e.preventDefault();
                        e.stopImmediatePropagation();
                        var selectedCur = this.getAttribute('data-currency');
                        setCurrency(selectedCur, false);
                    });
                });

                // Apply saved currency if set
                var savedCur = safeStorage.get('game_currency');
                if (savedCur && (savedCur === 'IDR' || savedCur === 'USD')) {
                    setCurrency(savedCur, true);
                }

                function checkNative() {
                    return !!(
                        document.fullscreenElement ||
                        document.webkitFullscreenElement ||
                        document.mozFullScreenElement ||
                        document.msFullscreenElement
                    );
                }

                function updateFullscreenUI(active) {
                    isFullscreenState = active;
                    if (active) {
                        container.classList.add('fullscreen');
                        container.classList.add('is-fullscreen');
                        document.body.classList.add('game-is-fullscreen');
                        document.documentElement.classList.add('game-is-fullscreen');
                        if (openWrapper) openWrapper.style.display = 'none';
                        if (closeWrapper) closeWrapper.style.display = 'block';
                        if (iframe) {
                            iframe.style.width = '100%';
                            iframe.style.height = '100%';
                        }
                    } else {
                        container.classList.remove('fullscreen');
                        container.classList.remove('is-fullscreen');
                        document.body.classList.remove('game-is-fullscreen');
                        document.documentElement.classList.remove('game-is-fullscreen');
                        if (openWrapper) openWrapper.style.display = 'block';
                        if (closeWrapper) closeWrapper.style.display = 'none';
                        if (iframe) {
                            iframe.style.width = '100%';
                            iframe.style.height = '100%';
                        }
                    }
                }

                function requestFullscreen() {
                    updateFullscreenUI(true);

                    var req = container.requestFullscreen ||
                              container.webkitRequestFullscreen ||
                              container.webkitRequestFullScreen ||
                              container.mozRequestFullScreen ||
                              container.msRequestFullscreen;

                    if (req) {
                        try {
                            var promise = req.call(container, { navigationUI: 'hide' });
                            if (promise && promise.catch) {
                                promise.catch(function (err) {
                                    console.warn('Native fullscreen request rejected, using CSS fallback:', err);
                                });
                            }
                        } catch (e) {
                            console.warn('Native fullscreen call error:', e);
                        }
                    }

                    try {
                        if (iframe && iframe.contentWindow) {
                            iframe.contentWindow.focus();
                        }
                    } catch (e) {}
                }

                function exitFullscreen() {
                    if (checkNative()) {
                        var exit = document.exitFullscreen ||
                                   document.webkitExitFullscreen ||
                                   document.webkitCancelFullScreen ||
                                   document.mozCancelFullScreen ||
                                   document.msExitFullscreen;
                        if (exit) {
                            try {
                                var promise = exit.call(document);
                                if (promise && promise.catch) {
                                    promise.catch(function () {});
                                }
                            } catch (e) {}
                        }
                    }
                    updateFullscreenUI(false);
                }

                window.addEventListener('keydown', function (e) {
                    if (e.keyCode === 27 && isFullscreenState) {
                        exitFullscreen();
                    }
                });

                function onFullscreenChange() {
                    var nativeActive = checkNative();
                    if (!nativeActive && isFullscreenState) {
                        updateFullscreenUI(false);
                    } else if (nativeActive && !isFullscreenState) {
                        updateFullscreenUI(true);
                    }
                }

                document.addEventListener('fullscreenchange', onFullscreenChange);
                document.addEventListener('webkitfullscreenchange', onFullscreenChange);
                document.addEventListener('mozfullscreenchange', onFullscreenChange);
                document.addEventListener('MSFullscreenChange', onFullscreenChange);

                if (buttons) {
                    buttons.addEventListener('click', function (e) {
                        e.preventDefault();
                        e.stopImmediatePropagation();

                        var openTarget = e.target.closest('[data-open]');
                        var closeTarget = e.target.closest('[data-close]');

                        if (openTarget) {
                            requestFullscreen();
                        } else if (closeTarget) {
                            exitFullscreen();
                        } else {
                            if (isFullscreenState) {
                                exitFullscreen();
                            } else {
                                requestFullscreen();
                            }
                        }
                    }, true);
                }

                window.addEventListener('resize', function () {
                    if (isFullscreenState && iframe) {
                        iframe.style.width = '100%';
                        iframe.style.height = '100%';
                    }
                });
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', setupGame);
            } else {
                setupGame();
            }

            window.addEventListener('load', function () {
                setupGame();
            });
        })();
    </script>
</body>

</html>
